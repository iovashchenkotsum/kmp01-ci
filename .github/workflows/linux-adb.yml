# Разовая проверка команды адресного запуска превью из шпаргалки вечера 2 на Linux.
# 1) без устройства — разбор команды оболочкой; 2) с эмулятором (KVM на раннере).
name: Linux adb check
on:
  workflow_dispatch:
  push:
    branches: [ci-linux-adb]

jobs:
  adb:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - name: Сборка debug APK
        timeout-minutes: 20
        run: ./gradlew :androidApp:assembleDebug --console=plain

      - name: SDK как у студента — platform-tools в ~/Android/Sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          mkdir -p ~/Android/Sdk/platform-tools
          cp -r "$ANDROID_HOME/platform-tools/." ~/Android/Sdk/platform-tools/
          ls ~/Android/Sdk/platform-tools | head -5

      - name: 1. Команда из шпаргалки без устройства (разбор оболочкой)
        continue-on-error: true
        run: |
          ~/Android/Sdk/platform-tools/adb shell am start -n ru.kmpcourse.kmp01/androidx.compose.ui.tooling.PreviewActivity --es composable "ru.kmpcourse.kmp01.AppKt.App" 2>&1 | tee adb-nodevice.log
          echo "EXIT=${PIPESTATUS[0]}" | tee -a adb-nodevice.log

      - name: KVM, образ и AVD
        timeout-minutes: 15
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm | tee kvm.log
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDM="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          ls -l "$SDKM" "$AVDM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "emulator" "system-images;android-35;google_apis;x86_64" --sdk_root="$ANDROID_HOME" 2>&1 | tail -5
          ls "$ANDROID_HOME/system-images/android-35/google_apis/" || echo "ОБРАЗ НЕ УСТАНОВЛЕН"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME | ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-(пусто)} | ANDROID_USER_HOME=${ANDROID_USER_HOME:-(пусто)}"
          echo no | "$AVDM" create avd -n ci35 -k "system-images;android-35;google_apis;x86_64" --force
          echo "avdmanager exit=$?"
          echo "--- где лежат .ini:"; find "$HOME/.android" -name "*.ini" -maxdepth 3 2>/dev/null | tee -a kvm.log
          echo "--- список AVD:"; "$ANDROID_HOME/emulator/emulator" -list-avds | tee -a kvm.log
          "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 | tee -a kvm.log

      - name: 2. Эмулятор и команда из шпаргалки — в одном шаге
        timeout-minutes: 18
        continue-on-error: true
        run: |
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          ADB=~/Android/Sdk/platform-tools/adb
          nohup "$ANDROID_HOME/emulator/emulator" -avd ci35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > emu-out.log 2>&1 &
          end=$((SECONDS+540)); booted=false
          while [ $SECONDS -lt $end ]; do
            if [ "$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then booted=true; break; fi
            sleep 15
          done
          echo "BOOTED=$booted" | tee boot.log
          $ADB devices | tee -a boot.log
          $ADB install -r androidApp/build/outputs/apk/debug/androidApp-debug.apk 2>&1 | tee adb-device.log
          # Команда из шпаргалки — дословно:
          ~/Android/Sdk/platform-tools/adb shell am start -n ru.kmpcourse.kmp01/androidx.compose.ui.tooling.PreviewActivity --es composable "ru.kmpcourse.kmp01.AppKt.App" 2>&1 | tee -a adb-device.log
          echo "EXIT=${PIPESTATUS[0]}" | tee -a adb-device.log
          sleep 10
          $ADB shell dumpsys activity activities 2>&1 | grep -m3 PreviewActivity | tee -a adb-device.log
          $ADB shell screencap -p /sdcard/preview.png && $ADB pull /sdcard/preview.png preview.png 2>&1 | tee -a adb-device.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-adb-check
          path: |
            adb-nodevice.log
            kvm.log
            emu-out.log
            boot.log
            adb-device.log
            preview.png
